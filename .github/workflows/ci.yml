name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run benchmark
        run: |
          python -c "
          from main import RecommendationEngine
          import time
          engine = RecommendationEngine()
          data = [{'user_id': f'u{i}', 'item_id': f'i{j}', 'rating': (i+j)%5+1} for i in range(100) for j in range(50)]
          engine.train(data)
          start = time.time()
          for _ in range(100):
              engine.recommend('u0')
          elapsed = time.time() - start
          print(f'Average recommendation time: {elapsed/100*1000:.2f}ms')
          "
